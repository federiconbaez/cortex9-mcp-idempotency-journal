---
name: ci

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test (incluye 10k calls con fallas)
        run: cargo test --release

  overhead:
    name: overhead p99 < 2 ms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: medir proxy contra servidor directo
        run: ./scripts/overhead.sh

  asan:
    name: asan (nightly, build-std)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: test bajo AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: >-
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu
          --target-dir target/asan --tests
